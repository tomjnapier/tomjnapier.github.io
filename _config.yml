# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Tom J Napier
email: tomjnapier@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Hi there, I’m Tom. I’m a web developer and accessibilty specialist. I’m currently working for the civil service in the UK.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://tomjnapier.co.uk" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  tomjnapier
rss: "Atom feed"

author: 
  name: "Tom J Napier"
  email: "hi@tomjnapier.co.uk"

# Build settings
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate-v2

sass:
  style: compressed

host: localhost
permalink: /:categories/:year/:month/:day/:title

collections:
  category:
    output: true

include: ['_pages']
show_excerpts: true

defaults:
  - scope:
      path: "" # This applies to all files in your project
    values:
      image: /assets/images/default-share.png

#SEO/Social
logo: /assets/images/social-logo.png
twitter:
  card: /assets/images/default-share.png
locale: en_GB

pagination:
  enabled: true
  per_page: 10
  permalink: "/page/:num/"
  title: ":title - page :num"
  sort_field: "date"
  sort_reverse: true
  trail: 
    before: 2 # Number of links to show before the current page
    after: 2  # Number of links to show after the current page
